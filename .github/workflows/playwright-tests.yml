name: Playwright Tests + Allure Report

on:
  push:
    branches:
      - master  # Runs when code is merged to main

permissions:
  contents: read
  pages: write
  id-token: write  # Needed to publish Allure report to GitHub Pages

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # ── 3. Install Python dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ── 4. Install Playwright browsers ─────────────────────────────────────
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      # ── 5. Set up Java (required by Allure CLI) ────────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ── 6. Install Allure CLI ──────────────────────────────────────────────
      - name: Install Allure CLI
        run: |
          curl -o allure.deb -L https://github.com/allure-framework/allure2/releases/latest/download/allure_2.39.0-1_all.deb
          sudo apt-get install -y ./allure.deb
          allure --version

      # ── 7. Run Playwright tests with Allure results output ─────────────────
      - name: Run tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          pytest --alluredir=allure-results -v
        continue-on-error: true  # Ensures report is generated even if tests fail

      # ── 8. Download previous Allure history (for trends) ──────────────────
      - name: Get previous Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history from previous report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/ 2>/dev/null || true

      # ── 9. Generate Allure HTML report ─────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      # ── 10. Upload raw results as artifact (optional, useful for debugging) ─
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      # ── 11. Publish Allure report to GitHub Pages ──────────────────────────
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
